name: Deploy to Cloud Run

"on":
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-main
  cancel-in-progress: false

env:
  PROJECT_ID: line-zona
  REGION: asia-east1
  SERVICE: devrel-visit-bot
  IMAGE: asia-east1-docker.pkg.dev/line-zona/cloud-run-source-deploy/devrel-visit-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/844707654468/locations/global/workloadIdentityPools/github-line-visit/providers/zonawang-group-memory
          service_account: github-line-visit-deployer@line-zona.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --update-env-vars "VISIT_GROUP_COLLECTION=visit_group_events,ENABLE_GENAI=true,GOOGLE_CLOUD_PROJECT=line-zona,VERTEX_AI_LOCATION=global,GENAI_MODEL=gemini-2.5-flash" \
            --timeout "15s" \
            --quiet
          SERVICE_URL="$(gcloud run services describe "${SERVICE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)')"
          curl --fail --silent --show-error "${SERVICE_URL}/ready"
